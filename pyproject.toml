[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failsafe"
version = "1.0.0"
description = "FailSafe - gated, audited Razorpay revenue-recovery agent. The LLM proposes; deterministic code decides."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp==2.1.1",
    "razorpay==2.0.1",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.13.2",
]

[project.scripts]
failsafe = "failsafe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (line length) handled by formatter; module docstring policy is
# enforced culturally, not mechanically - many historical modules carry
# long narrative docstrings that ruff would flag under pydocstyle rules.
ignore = ["E501"]
